<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#C81E3A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="McNeice-Lake">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Nunito:wght@300;400;600;700&display=swap">
<title>McNeice-Lake Planner</title>
<style>
:root{--r:#C81E3A;--ink:#3A0F16;--cream:#FFFDF9;--g:#2E7D32;--mut:#6B3A44;--thin:400;--hf:"Baloo 2","Nunito","Helvetica Neue",system-ui,sans-serif;--pk:#F2B6C0;box-sizing:border-box}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);font-family:"Nunito","Helvetica Neue",system-ui,-apple-system,sans-serif;font-weight:var(--thin);font-size:18px;background-color:#fff;background-image:linear-gradient(rgba(200,30,58,.2) 50%,transparent 50%),linear-gradient(90deg,rgba(200,30,58,.2) 50%,transparent 50%);background-size:44px 44px;overflow-x:hidden}
#app{max-width:480px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top,0px)) 12px calc(104px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-family:var(--hf);font-weight:700;font-size:23px;line-height:1.1}
h2{margin:0;font-family:var(--hf);font-weight:700;font-size:22px;line-height:1.15}
h3{margin:0;font-family:var(--hf);font-weight:700;font-size:18px}
.card{background:var(--cream);border:2.5px solid var(--r);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 4px 0 var(--pk);min-width:0}
.card>*,.add>*,.two>*,.f>*,.item>*{min-width:0}
.top{display:flex;align-items:center;gap:10px;background:var(--cream);border:2.5px solid var(--r);border-radius:22px;padding:8px 14px;box-shadow:0 4px 0 var(--pk)}
.ttl{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.ttl small{font-size:12px;color:var(--mut);line-height:1.2;min-height:14px}
.hello{align-items:center;text-align:center;background:#FFF1F3;gap:2px}
.hello .dow{font-size:20px;font-weight:700}
.hello .big{font-family:var(--hf);font-weight:700;font-size:36px;line-height:1.1}
.trail{height:20px;overflow:hidden;position:relative;margin:-6px 0}
.ant{position:absolute;left:-30px;top:2px;width:26px;height:16px;animation:walk 16s linear infinite}
@keyframes walk{to{transform:translateX(calc(100vw + 60px))}}
@media (prefers-reduced-motion:reduce){.ant{animation:none;left:12%}.ant:nth-child(2){left:48%}.ant:nth-child(3){left:80%}}
button{font:inherit;color:inherit;cursor:pointer}
.b{background:var(--r);color:#fff;font-weight:700;font-size:18px;min-height:52px;border:0;border-radius:999px;padding:0 18px;box-shadow:0 3px 0 #8E1229}
.b2{background:#fff;color:var(--r);font-weight:700;border:2.5px solid var(--r);border-radius:999px;min-height:48px;padding:0 14px;font-size:17px}
input[type=text],input[type=time],input[type=date],select{font:inherit;font-size:18px;color:var(--ink);width:100%;max-width:100%;min-width:0;min-height:48px;border:2px solid #F0C9CF;border-radius:14px;padding:8px 12px;background:#fff;margin:0;font-weight:400}
input[type=time],input[type=date]{-webkit-appearance:none;appearance:none;display:block;text-align:left}
input:focus,select:focus{outline:3px solid #F7A8B4}
label.f{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:16px;min-width:0}
.row{display:flex;align-items:center;gap:12px;min-height:50px;text-align:left;background:none;border:0;padding:2px 0;width:100%;font-size:18px}
.box{width:30px;height:30px;border-radius:50%;border:2.5px solid var(--r);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:800;background:#fff}
.row.on .box{background:var(--r);color:#fff}
.item{display:flex;align-items:center;gap:8px;min-height:50px}
.item>.row{flex:1;min-width:0}
.item>span{flex:1}
.del{width:46px;height:46px;border:0;background:none;font-size:26px;color:var(--mut);flex-shrink:0}
.add{display:flex;flex-direction:column;gap:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ans{border-radius:18px;padding:14px;border:2.5px solid;display:flex;flex-direction:column;gap:4px}
.ans b{font-size:23px;line-height:1.2}
.ans.yes{background:#E3F4E5;border-color:var(--g)}
.ans.no{background:#FFF1D6;border-color:#C98A00}
.ans.lim{background:#FDE1E4;border-color:var(--r)}
.pill{display:inline-block;border-radius:999px;padding:3px 12px;font-weight:700;font-size:15px;background:#FDE1E4;border:2px solid var(--r);white-space:nowrap}
.pill.ok{background:#E3F4E5;border-color:var(--g)}
.mut{color:var(--mut);font-size:15px}
.nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);background:var(--cream);border-top:3px solid var(--r);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));gap:4px}
.nav button{border:0;background:none;min-height:54px;font-weight:700;font-size:13px;border-radius:14px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.nav button span{font-size:20px}
.nav button.on{background:var(--r);color:#fff}
.wk{display:flex;align-items:center;justify-content:space-between;gap:8px}
.wk .b2{width:50px;padding:0;font-size:24px}
details summary{font-weight:700;min-height:44px;display:flex;align-items:center}
.cb{display:flex;align-items:center;gap:10px;font-size:17px;min-height:44px}
.cb input{width:26px;height:26px;accent-color:var(--r)}
.swr{display:grid;grid-template-columns:64px 1fr;gap:6px 8px;align-items:center}
.swr b{font-size:16px}
.swb{min-height:48px;border-radius:999px;border:2.5px solid var(--pk);background:#fff;font-weight:700;font-size:16px}
.swb.plan{border-color:#C98A00;background:#FFF1D6}
.swb.done{border-color:var(--g);background:#E3F4E5}
.swr input{grid-column:1/-1}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--cream);border:2.5px solid var(--r);border-radius:999px;padding:4px;box-shadow:0 4px 0 var(--pk)}
.seg button{border:0;background:none;min-height:46px;border-radius:999px;font-weight:700;font-size:15px;padding:0}
.seg button.on{background:var(--r);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--r);background:#fff;color:var(--r);border-radius:999px;min-height:44px;padding:0 14px;font-weight:700;font-size:16px}
.gh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sm{min-height:44px;font-size:15px;padding:0 12px}
.seg.two{grid-template-columns:1fr 1fr}
.b2:disabled{opacity:.35;cursor:default}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cg>b{text-align:center;font-size:14px}
.cd{min-height:56px;border:2px solid var(--pk);background:#fff;border-radius:14px;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:700;font-size:16px;min-width:0}
.cd i{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;min-height:10px;padding:0 2px}
.cd.tod{border-color:var(--r)}
.cd.sel{background:var(--r);color:#fff}
.cd:disabled{opacity:.3}
u{display:inline-block;width:8px;height:8px;border-radius:50%;text-decoration:none}
u.sq{border-radius:2px}
u.dia{border-radius:2px;transform:rotate(45deg) scale(.9)}
u.ring{background:#fff;border:2.5px solid;width:10px;height:10px}
.cd.sel u{box-shadow:0 0 0 1.5px #fff}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.vine{text-align:center;letter-spacing:6px;font-size:14px;margin:-4px 0;opacity:.9}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="ant" viewBox="0 0 26 16"><g fill="#2B1B1B" stroke="#2B1B1B" stroke-width="1" stroke-linecap="round"><ellipse cx="5" cy="8" rx="5" ry="3.5"/><circle cx="13" cy="8" r="2.6"/><circle cx="19.5" cy="8" r="3"/><path fill="none" d="M11 8L8 2M13 8L13 1M15 8L18 2M11 8L8 14M13 8L13 15M15 8L18 14M21 6L25 2M21 10L25 14"/></g></symbol></svg>
<div id="app"></div>
<script>
const API="https://script.google.com/macros/s/AKfycbwpcnLnaJUMTgI7x2UeBzSMOlcC50BJrLzHvgoQgwqpuhk0ao7-q8vWGmwYx3Y5hzz2/exec"
const START="2026-10-27",PCOL={Sheila:"#E0457B",Bill:"#2F6FDE",Megan:"#8B4FC7",Everyone:"#2E9E5B"},BCOL="#E5B400",SCOL="#17A2B8";
const PEOPLE=["Sheila","Bill","Megan"],WHO=[...PEOPLE,"Everyone"],ty=a=>a.y=="s"?"\u{1F389} ":"",tsel='<select id="ay"><option value="a">\u{1F4C5} Appointment</option><option value="s">\u{1F389} Social plan</option></select>',DN=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const esc=t=>String(t==null?"":t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const wd=x=>DN[(x.getDay()+6)%7];
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const fromIso=s=>{const p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const monday=d=>{const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const fd=(d,o)=>d.toLocaleDateString("en-IE",o);
const tm=ms=>new Date(ms).toLocaleTimeString("en-IE",{hour:"numeric",minute:"2-digit"});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const val=id=>{const e=document.getElementById(id);return e?e.value.trim():""};
let S={},pend={},code="";
try{S=JSON.parse(localStorage.getItem("fp_s")||"{}");pend=JSON.parse(localStorage.getItem("fp_p")||"{}");code=localStorage.getItem("fp_c")||""}catch(e){}
let wv="list",calM=new Date(new Date().getFullYear(),new Date().getMonth(),1),calSel=iso(new Date()),tab="today",lt="todo",lastStore="",picked="",wk=monday(new Date()),status="";
const keep=()=>{try{localStorage.setItem("fp_s",JSON.stringify(S));localStorage.setItem("fp_p",JSON.stringify(pend))}catch(e){}};
const ready=()=>API.indexOf("http")===0;
function setStatus(t){status=t;const e=document.getElementById("st");if(e)e.textContent=t}
let ft;
function set(k,v){if(v===null)delete S[k];else S[k]=v;pend[k]=v;keep();clearTimeout(ft);ft=setTimeout(flush,700);setStatus("Saving...")}
function list(pre){return Object.keys(S).filter(k=>k.indexOf(pre)===0).map(k=>Object.assign({k:k},S[k]))}
async function flush(){if(!ready()||!code)return;const snap=pend;if(!Object.keys(snap).length)return;pend={};keep();
try{const r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify({code:code,set:snap})});const j=await r.json();if(j.error)throw 0;setStatus("Synced")}
catch(e){Object.keys(snap).forEach(k=>{if(!(k in pend))pend[k]=snap[k]});keep();setStatus("Offline, saved here")}}
async function pull(){if(!ready()||!code)return;
try{const r=await fetch(API+"?code="+encodeURIComponent(code)+"&t="+Date.now());const j=await r.json();
if(j.error){code="";localStorage.removeItem("fp_c");render();return}
const n={};for(const k in j.data){try{n[k]=JSON.parse(j.data[k])}catch(e){n[k]=j.data[k]}}
for(const k in pend){if(pend[k]===null)delete n[k];else n[k]=pend[k]}
S=n;keep();setStatus("Synced");const a=document.activeElement;if(!a||!/INPUT|SELECT/.test(a.tagName))render()}
catch(e){setStatus("Offline, saved here")}}
const inp=(k,l,ph)=>`<label class="f">${l}<input type="text" data-k="${esc(k)}" placeholder="${esc(ph||"")}" value="${esc(S[k])}"></label>`;
const chk=(on,l,a,k)=>`<button class="row${on?" on":""}" data-a="${a}" data-k="${esc(k)}"><span class="box">${on?"&#10003;":""}</span><span>${l}</span></button>`;
const del=k=>`<button class="del" data-a="del" data-k="${esc(k)}" aria-label="Remove">&times;</button>`;
function hello(){const n=new Date(),h=n.getHours(),g=h<12?"Good morning":h<18?"Good afternoon":"Good evening";
return `<div class="card hello"><span class="dow">${fd(n,{weekday:"long"})}</span><span class="big">${fd(n,{day:"numeric",month:"long"})}</span><span>${g}! \u{1F353}</span></div>`}
function pain(){const hrs=+S["set|painHrs"]||4,max=+S["set|painMax"]||0,now=Date.now();
const ds=list("pain|").sort((a,b)=>a.t-b.t),last=ds.length?ds[ds.length-1].t:0,c24=ds.filter(x=>now-x.t<864e5).length,next=last+hrs*36e5;
let cls,msg,sub;
if(max&&c24>=max){cls="lim";msg="Not yet. The daily limit has been reached.";sub=c24+" dose"+(c24==1?"":"s")+" in the last 24 hours. Please check the label or ask the pharmacist."}
else if(!last||now>=next){cls="yes";msg=last?"Yes, it's been "+hrs+" hours or more.":"No doses logged yet.";sub=last?"Last dose at "+tm(last)+".":"Check the label before the first dose."}
else{cls="no";const m=Math.ceil((next-now)/6e4);msg="Not yet. Next dose from "+tm(next)+".";sub="That's in "+(m>=60?Math.floor(m/60)+" h ":"")+(m%60)+" min. Last dose at "+tm(last)+"."}
const td=iso(new Date()),today=ds.filter(x=>iso(new Date(x.t))==td);
return `<div class="card"><h2>\u{1F48A} Is it time to take drugs yet?</h2><div class="ans ${cls}"><b>${msg}</b><span>${sub}</span></div>
<button class="b" data-a="pain">I took it just now</button>
<div class="add"><label class="f">Took it earlier? Pick the time<input type="time" id="pt"></label><button class="b2" data-a="painAt">Add that time</button></div>
<h3>Today's doses</h3>${today.length?today.map(x=>`<div class="item"><span>${tm(x.t)}</span>${del(x.k)}</div>`).join(""):'<span class="mut">None logged today.</span>'}
<details><summary>Settings</summary><div class="add">${inp("set|painHrs","Hours between doses","4")}${inp("set|painMax","Most doses in 24 hours (from the label)","Leave blank if unsure")}</div></details>
<span class="mut">A reminder log only. Always follow the label, doctor or pharmacist.</span></div>`}
function meds(d){const slots=[["Sheila","am","Sheila, morning"],["Sheila","pm","Sheila, evening"],["Bill","am","Bill, morning"],["Bill","pm","Bill, evening"],["Megan","am","Megan"]];
return `<div class="card"><h2>\u{1F337} Meds taken today</h2>${slots.map(s=>{const k="med|"+d+"|"+s[0]+"|"+s[1];return chk(S[k],s[2],"tog",k)}).join("")}</div>`}
const meals=(d,t)=>`<div class="card"><h2>\u{1F37D}️ ${t}</h2>${inp("meal|"+d+"|b","\u{1F963} Breakfast")}${inp("meal|"+d+"|l","\u{1F96A} Lunch")}${inp("meal|"+d+"|d","\u{1F35D} Dinner")}</div>`;
const swv=d=>{const v=S["sw|"+d];return v&&typeof v=="object"?v:{}};
function swToday(){const d=iso(new Date()),v=swv(d),s=v.s||"",note=v.x?`<span>${esc(v.x)}</span>`:"";let body;
if(s=="done")body=`<div class="ans yes"><b>Yes, Sheila swam today! \u{1F30A}</b>${note}</div><button class="b2" data-a="sw" data-k="${d}" data-v="">Undo</button>`;
else if(s=="plan")body=`<div class="ans no"><b>Swim planned today \u{1F3CA}‍♀️</b>${note}</div><button class="b" data-a="sw" data-k="${d}" data-v="done">Sheila swam!</button><button class="b2" data-a="sw" data-k="${d}" data-v="">Cancel the plan</button>`;
else body=`<div class="ans no"><b>No swim planned today</b></div><div class="two"><button class="b2" data-a="sw" data-k="${d}" data-v="plan">Plan a swim</button><button class="b" data-a="sw" data-k="${d}" data-v="done">Sheila swam!</button></div>`;
return `<div class="card"><h2>\u{1F3CA}‍♀️ Did Sheila swim today?</h2>${body}</div>`}
function swWeek(days){const n=days.filter(x=>swv(iso(x)).s=="done").length,p=days.filter(x=>swv(iso(x)).s=="plan").length;
return `<div class="card"><h2>\u{1F3CA}‍♀️ Sheila's swims</h2><span class="mut">${n} swam, ${p} planned this week. Tap a day to change it.</span>`+days.map((x,i)=>{const d=iso(x),s=swv(d).s||"",lbl=s=="done"?"\u{1F30A} Swam!":s=="plan"?"\u{1F3CA} Planned":"No swim";
return `<div class="swr"><b>${wd(x).slice(0,3)} ${x.getDate()}</b><button class="swb ${s}" data-a="swc" data-k="${d}">${lbl}</button>${s?`<input type="text" data-sw="${d}" placeholder="Time or note (e.g. 10am)" value="${esc(swv(d).x)}">`:""}</div>`}).join("")+`</div>`}
const apptRow=a=>`<div class="item"><span><b>${esc(a.t||"")}</b> ${esc(a.w)}: ${ty(a)}${esc(a.x)}</span>${del(a.k)}</div>`;
function dueLbl(b){const df=Math.round((fromIso(b.d)-fromIso(iso(new Date())))/864e5);return df<0?["Overdue by "+(-df)+" day"+(df==-1?"":"s"),0]:df==0?["Due today",0]:["Due in "+df+" day"+(df==1?"":"s"),df<=3?0:1]}
const billRow=b=>{const l=dueLbl(b);return `<div class="item"><span><b>${esc(b.n)}</b> ${esc(b.amt)}<br><span class="pill${l[1]?" ok":""}">${l[0]}</span> <span class="mut">${fd(fromIso(b.d),{day:"numeric",month:"short"})}</span></span><button class="b2" data-a="paid" data-k="${esc(b.k)}">Paid &#10003;</button>${del(b.k)}</div>`};
const chatRow=c=>`<div class="item"><span><b>${esc(c.w)}</b> ${esc(c.x||"")}<br><span class="mut">${tm(c.t)}</span></span>${del(c.k)}</div>`;
function vToday(){const d=iso(new Date()),ap=list("appt|").filter(a=>a.d==d).sort((a,b)=>(a.t||"")<(b.t||"")?-1:1),
bl=list("bill|").filter(b=>!b.paid&&Math.round((fromIso(b.d)-fromIso(d))/864e5)<=7).sort((a,b)=>a.d<b.d?-1:1),ch=list("chat|").filter(c=>c.d==d).sort((a,b)=>a.t-b.t);
return hello()+pain()+meds(d)+swToday()+meals(d,"Today's meals")+`<div class="card"><h2>\u{1F4C5} Appointments today</h2>${ap.length?ap.map(apptRow).join(""):'<span class="mut">Nothing booked today.</span>'}</div>
<div class="card"><h2>\u{1F4B6} Bills due soon</h2>${bl.length?bl.map(billRow).join(""):'<span class="mut">Nothing due this week.</span>'}</div>
<div class="card"><h2>\u{1F4AC} Who did we chat to today?</h2>${ch.length?ch.map(chatRow).join(""):'<span class="mut">No chats logged yet.</span>'}<button class="b2" data-a="tab" data-k="chats">Add a chat</button></div>`}
function vWeek(){const seg=`<div class="seg two">${[["list","This week"],["cal","Calendar"]].map(x=>`<button class="${wv==x[0]?"on":""}" data-a="wv" data-k="${x[0]}">${x[1]}</button>`).join("")}</div>`;return seg+(wv=="cal"?vCal():vWeekList())}
function vWeekList(){const m0=monday(fromIso(START)),days=[...Array(7)].map((_,i)=>addD(wk,i)).filter(x=>iso(x)>=START),ap=days.length?list("appt|").filter(a=>a.d>=iso(days[0])&&a.d<=iso(days[days.length-1])):[];
return `<div class="wk"><button class="b2" data-a="wk" data-k="-1" aria-label="Previous week"${wk<=m0?" disabled":""}>&#8249;</button><h2>Week of ${fd(wk,{day:"numeric",month:"short"})}</h2><button class="b2" data-a="wk" data-k="1" aria-label="Next week">&#8250;</button></div>`+swWeek(days)+
`<div class="card"><h2>\u{1F4C5} Appointments this week</h2>${WHO.map(p=>{const m=ap.filter(a=>a.w==p).sort((a,b)=>(a.d+(a.t||""))<(b.d+(b.t||""))?-1:1);return `<h3>${p}</h3>${m.length?m.map(a=>`<div class="item"><span><b>${wd(fromIso(a.d))}</b> ${esc(a.t||"")} ${ty(a)}${esc(a.x)}</span>${del(a.k)}</div>`).join(""):'<span class="mut">None</span>'}`}).join("")}
<h3>Add an appointment or social plan</h3><div class="add">${tsel}<div class="two"><select id="aw">${WHO.map(p=>`<option>${p}</option>`).join("")}</select><select id="ad">${days.map(x=>`<option value="${iso(x)}">${wd(x).slice(0,3)} ${x.getDate()}</option>`).join("")}</select></div><label class="f">Time<input type="time" id="at"></label><input type="text" id="ax" placeholder="What is it? (e.g. Dentist, Coffee with Ann)"><button class="b" data-a="addap">Add</button></div></div>`+
days.map(x=>meals(iso(x),wd(x)+" "+fd(x,{day:"numeric",month:"short"}))).join("")}
function vCal(){const y=calM.getFullYear(),mo=calM.getMonth(),off=(new Date(y,mo,1).getDay()+6)%7,dim=new Date(y,mo+1,0).getDate(),today=iso(new Date()),ap=list("appt|"),bl=list("bill|").filter(b=>!b.paid);
const dots=d=>{let o="";ap.filter(a=>a.d==d).forEach(a=>o+=`<u class="${a.y=="s"?"dia":""}" style="background:${PCOL[a.w]||"#777"}"></u>`);if(bl.some(b=>b.d==d))o+=`<u class="sq" style="background:${BCOL}"></u>`;if(swv(d).s)o+=`<u class="ring" style="border-color:${SCOL}"></u>`;return o};
let cells="";for(let i=0;i<off;i++)cells+="<span></span>";
for(let n=1;n<=dim;n++){const d=y+"-"+pad(mo+1)+"-"+pad(n),pre=d<START;cells+=`<button class="cd${d==calSel?" sel":""}${d==today?" tod":""}"${pre?" disabled":""} data-a="cs" data-k="${d}"><span>${n}</span><i>${pre?"":dots(d)}</i></button>`}
const sdt=fromIso(START),minM=new Date(sdt.getFullYear(),sdt.getMonth(),1),sd=fromIso(calSel),dapp=ap.filter(a=>a.d==calSel).sort((a,b)=>(a.t||"")<(b.t||"")?-1:1),dbl=bl.filter(b=>b.d==calSel),sv=swv(calSel);
return `<div class="wk"><button class="b2" data-a="cmn" data-k="-1" aria-label="Previous month"${calM<=minM?" disabled":""}>&#8249;</button><h2>${fd(calM,{month:"long",year:"numeric"})}</h2><button class="b2" data-a="cmn" data-k="1" aria-label="Next month">&#8250;</button></div>
<div class="card"><div class="cg">${["M","T","W","T","F","S","S"].map(x=>`<b>${x}</b>`).join("")}${cells}</div>
<div class="legend">${WHO.map(p=>`<span><u style="background:${PCOL[p]}"></u>${p}</span>`).join("")}<span><u class="dia" style="background:#777"></u>Social plan</span><span><u class="sq" style="background:${BCOL}"></u>Bill due</span><span><u class="ring" style="border-color:${SCOL}"></u>Swim</span></div></div>
<div class="card"><h2>${wd(sd)} ${fd(sd,{day:"numeric",month:"long"})}</h2>
${dapp.map(a=>`<div class="item"><span><span class="pill" style="border-color:${PCOL[a.w]||"#777"}">${esc(a.w)}</span> <b>${esc(a.t||"")}</b> ${ty(a)}${esc(a.x)}</span>${del(a.k)}</div>`).join("")}
${dbl.map(b=>`<div class="item"><span><b>${esc(b.n)}</b> ${esc(b.amt)}<br><span class="mut">Bill due</span></span><button class="b2" data-a="paid" data-k="${esc(b.k)}">Paid &#10003;</button></div>`).join("")}
${sv.s?`<span>\u{1F3CA}\u200D\u2640\uFE0F Swim: ${sv.s=="done"?"swam \u{1F30A}":"planned"} ${esc(sv.x||"")}</span>`:""}
${!dapp.length&&!dbl.length&&!sv.s?'<span class="mut">Nothing on this day.</span>':""}
<h3>Add an appointment or social plan</h3><div class="add"><input type="hidden" id="ad" value="${calSel}">${tsel}<select id="aw">${WHO.map(p=>`<option>${p}</option>`).join("")}</select><label class="f">Time<input type="time" id="at"></label><input type="text" id="ax" placeholder="What is it? (e.g. Dentist, Coffee with Ann)"><button class="b" data-a="addap">Add</button></div></div>`}
function vTodo(){const cw=iso(monday(new Date())),all=list("todo|"),it=all.filter(t=>!t.done||(t.rep&&t.dw!==cw)).sort((a,b)=>(a.c||0)-(b.c||0)),dl=all.filter(t=>t.done&&t.dw===cw).sort((a,b)=>(b.dt||0)-(a.dt||0));
return `<div class="card"><h2>✅ To do this week</h2>${it.length?it.map(t=>`<div class="item">${chk(false,esc(t.x)+(t.rep?' <span class="mut">(weekly)</span>':""),"td",t.k)}${del(t.k)}</div>`).join(""):'<span class="mut">All done. Lovely! \u{1F389}\u{1F353}</span>'}
<h3>Add something</h3><div class="add"><input type="text" id="tx" placeholder="What needs doing?"><label class="cb"><input type="checkbox" id="trep">Repeats every week</label><button class="b" data-a="addt">Add</button></div></div>`+(dl.length?`<div class="card"><h2>Done this week \u{1F389}</h2>${dl.map(t=>`<div class="item"><span>${esc(t.x)}</span><button class="b2 sm" data-a="tdb" data-k="${esc(t.k)}">Put back</button></div>`).join("")}</div>`:"")}
function vBills(){const all=list("bill|"),un=all.filter(b=>!b.paid).sort((a,b)=>a.d<b.d?-1:1),pd=all.filter(b=>b.paid).sort((a,b)=>(a.pd||"")<(b.pd||"")?1:-1).slice(0,5);
return `<div class="card"><h2>\u{1F4B6} Bills and payments</h2>${un.length?un.map(billRow).join(""):'<span class="mut">Nothing due. \u{1F389}</span>'}<h3>Add a bill</h3><div class="add"><input type="text" id="bn" placeholder="What is it? (e.g. electricity)"><input type="text" id="ba" placeholder="Amount (e.g. 85)"><label class="f">Due date<input type="date" id="bd"></label><label class="cb"><input type="checkbox" id="brep">Repeats every month</label><button class="b" data-a="addb">Add</button></div></div>
${pd.length?`<div class="card"><h2>Recently paid</h2>${pd.map(b=>`<div class="item"><span>${esc(b.n)} ${esc(b.amt)} <span class="mut">paid ${fd(fromIso(b.pd),{day:"numeric",month:"short"})}</span></span>${del(b.k)}</div>`).join("")}</div>`:""}`}
let chatQ="",chatN=40;
function chatLog(){const d=iso(new Date()),q=chatQ.trim().toLowerCase(),all=list("chat|").filter(c=>c.d<d&&c.d>=START&&(!q||((c.w||"")+" "+(c.x||"")).toLowerCase().indexOf(q)>-1)).sort((a,b)=>b.t-a.t),shown=all.slice(0,chatN);
if(!all.length)return '<span class="mut">'+(q?"No chats match that.":"Earlier days will appear here.")+'</span>';
let out="",last="";
shown.forEach(c=>{if(c.d!==last){last=c.d;out+=`<h3>${fd(fromIso(c.d),{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</h3>`}out+=`<div class="item"><span><b>${esc(c.w)}</b> ${esc(c.x||"")}<br><span class="mut">${tm(c.t)}</span></span>${del(c.k)}</div>`});
return `<span class="mut">${all.length} chat${all.length==1?"":"s"} logged${q?" matching":""}</span>`+out+(all.length>shown.length?'<button class="b2" data-a="cm">Show more</button>':"")}
function vChats(){const d=iso(new Date()),ch=list("chat|").filter(c=>c.d==d).sort((a,b)=>a.t-b.t);
return `<div class="card"><h2>\u{1F4AC} Who did we chat to today?</h2>${ch.length?ch.map(chatRow).join(""):'<span class="mut">No chats logged yet.</span>'}<h3>Add a chat</h3><div class="add"><input type="text" id="cw" placeholder="Who?"><input type="text" id="cx" placeholder="What about? (optional)"><button class="b" data-a="addc">Add</button></div></div>
<div class="card"><h2>\u{1F4D6} Chat log</h2><input type="text" id="cq" placeholder="Search a name or topic" value="${esc(chatQ)}"><div id="clog" class="add">${chatLog()}</div><span class="mut">Every chat is kept here for good.</span></div>`}
function vShop(){const now=Date.now(),all=list("shop|");
all.filter(i=>i.done&&now-i.dt>864e5).forEach(i=>set(i.k,null));
const stores=list("store|").sort((a,b)=>(a.c||0)-(b.c||0)),open=all.filter(i=>!i.done).sort((a,b)=>(a.c||0)-(b.c||0)),ks={};stores.forEach(x=>ks[x.k]=1);
const rec=all.filter(i=>i.done&&now-i.dt<=864e5).sort((a,b)=>b.dt-a.dt),any=open.filter(i=>!i.s||!ks[i.s]);
const rows=its=>its.length?its.map(i=>`<div class="item">${chk(false,esc(i.x),"shd",i.k)}${del(i.k)}</div>`).join(""):'<span class="mut">Nothing needed here.</span>';
const sug=["Tesco","Lidl","Boots","Dunnes","SuperValu"].filter(n=>!stores.some(x=>x.n.toLowerCase()==n.toLowerCase()));
return `<div class="card"><h2>\u{1F6D2} Add to the list</h2><div class="add"><input type="text" id="shx" placeholder="What do we need?"><label class="f">Where from?<select id="shs"><option value="">Anywhere</option>${stores.map(x=>`<option value="${esc(x.k)}"${x.k==lastStore?" selected":""}>${esc(x.n)}</option>`).join("")}</select></label><button class="b" data-a="addsh">Add</button></div></div>`+
stores.map(x=>`<div class="card"><div class="gh"><h2>${esc(x.n)}</h2>${del(x.k)}</div>${rows(open.filter(i=>i.s==x.k))}</div>`).join("")+
(any.length||!stores.length?`<div class="card"><h2>Anywhere</h2>${rows(any)}</div>`:"")+
(rec.length?`<div class="card"><h2>Just ticked off</h2>${rec.map(i=>`<div class="item"><span>${esc(i.x)}</span><button class="b2 sm" data-a="shb" data-k="${esc(i.k)}">Put back</button></div>`).join("")}</div>`:"")+
`<div class="card"><h2>\u{1F3EA} Add a shop</h2>${sug.length?`<div class="chips">${sug.map(n=>`<button class="chip" data-a="addst" data-v="${n}">+ ${n}</button>`).join("")}</div>`:""}<div class="add"><input type="text" id="stn" placeholder="Another shop (e.g. Aldi)"><button class="b2" data-a="addst">Add shop</button></div><span class="mut">Remove a shop with the &times; and its items move to Anywhere.</span></div>`}
function vIdeas(){const all=list("idea|").sort((a,b)=>(b.c||0)-(a.c||0)),pk=picked&&S[picked]?S[picked]:null;
return `<div class="card"><h2>\u{1F373} Meal ideas</h2>${all.length?'<button class="b2" data-a="pick">Pick one for me \u{1F3B2}</button>':""}${pk?`<div class="ans yes"><b>${esc(pk.x)}</b>${pk.n?`<span>${esc(pk.n)}</span>`:""}</div>`:""}${all.length?all.map(i=>`<div class="item"><span><b>${esc(i.x)}</b>${i.n?`<br><span class="mut">${esc(i.n)}</span>`:""}</span>${del(i.k)}</div>`).join(""):'<span class="mut">Nothing saved yet. Add the meals you all like.</span>'}<h3>Save an idea</h3><div class="add"><input type="text" id="idx" placeholder="Meal name"><input type="text" id="idn" placeholder="Notes or link (optional)"><button class="b" data-a="addid">Add</button></div></div>`}
function vLists(){const segs=[["todo","To-do"],["shop","Shopping"],["ideas","Meal ideas"]];
return `<div class="seg">${segs.map(x=>`<button class="${lt==x[0]?"on":""}" data-a="lt" data-k="${x[0]}">${x[1]}</button>`).join("")}</div>`+(lt=="shop"?vShop():lt=="ideas"?vIdeas():vTodo())}
const TABS=[["today","Today","\u{1F353}",vToday],["week","Week","\u{1F41E}",vWeek],["lists","Lists","\u{1F955}",vLists],["bills","Bills","\u{1F34B}",vBills],["chats","Chats","\u{1F41D}",vChats]];
function render(){const app=document.getElementById("app");
if(!ready()){app.innerHTML='<div class="card"><h2>Not set up yet</h2><span>Paste your web app link into the API line at the top of the script in index.html.</span></div>';return}
if(!code){app.innerHTML='<div class="card"><h1>McNeice-Lake Planner</h1><label class="f">Family code<input type="text" id="cin" autocapitalize="none" autocomplete="off"></label><button class="b" data-a="code">Open</button></div>';return}
const logo='<svg viewBox="0 0 40 44" width="34" height="38" aria-hidden="true"><path d="M20 42C6 34 3 22 6 16c4-6 24-6 28 0 3 6 0 18-14 26z" fill="#C81E3A"/><path d="M20 13L12 4l6 5 2-7 2 7 6-5z" fill="#2E7D32"/><g fill="#FFE9A8"><ellipse cx="14" cy="20" rx="1.2" ry="1.8"/><ellipse cx="22" cy="19" rx="1.2" ry="1.8"/><ellipse cx="28" cy="23" rx="1.2" ry="1.8"/><ellipse cx="18" cy="27" rx="1.2" ry="1.8"/><ellipse cx="25" cy="30" rx="1.2" ry="1.8"/><ellipse cx="20" cy="35" rx="1.2" ry="1.8"/></g></svg>';
const v=TABS.find(t=>t[0]==tab)[3];
app.innerHTML=`<div class="top">${logo}<div class="ttl"><h1>McNeice-Lake Planner</h1><small id="st">${esc(status)}</small></div></div><div class="trail" aria-hidden="true"><svg class="ant"><use href="#ant"/></svg><svg class="ant" style="animation-delay:-5s"><use href="#ant"/></svg><svg class="ant" style="animation-delay:-11s"><use href="#ant"/></svg></div>${v()}<div class="vine" aria-hidden="true">\u{1F353} \u{1F353} \u{1F353}</div><nav class="nav">${TABS.map(t=>`<button class="${t[0]==tab?"on":""}" data-a="tab" data-k="${t[0]}"><span>${t[2]}</span>${t[1]}</button>`).join("")}</nav>`}
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,k=b.dataset.k,cw=iso(monday(new Date())),td=iso(new Date());
if(a=="tab"){tab=k;window.scrollTo(0,0)}
else if(a=="wk"){const n=addD(wk,7*+k);if(n>=monday(fromIso(START)))wk=n}
else if(a=="wv")wv=k;
else if(a=="cs")calSel=k;
else if(a=="cmn"){const n=new Date(calM.getFullYear(),calM.getMonth()+ +k,1),sd=fromIso(START);if(n>=new Date(sd.getFullYear(),sd.getMonth(),1)){calM=n;const f=iso(n),t=iso(new Date());calSel=t.slice(0,7)==f.slice(0,7)&&t>=START?t:(f<START?START:f)}}
else if(a=="lt")lt=k;
else if(a=="cm")chatN+=40;
else if(a=="code"){const c=val("cin");if(!c)return;code=c;localStorage.setItem("fp_c",c);pull()}
else if(a=="tog")set(k,!S[k]);
else if(a=="del")set(k,null);
else if(a=="sw"){const v=b.dataset.v,o=swv(k);if(!v)set("sw|"+k,null);else set("sw|"+k,{s:v,x:o.x||""})}
else if(a=="swc"){const o=swv(k),c=o.s||"",n=c==""?"plan":c=="plan"?"done":"";if(!n)set("sw|"+k,null);else set("sw|"+k,{s:n,x:o.x||""})}
else if(a=="pain")set("pain|"+uid(),{t:Date.now()});
else if(a=="painAt"){const v=val("pt");if(!v)return;const p=v.split(":"),x=new Date();x.setHours(+p[0],+p[1],0,0);if(x>new Date())x.setDate(x.getDate()-1);set("pain|"+uid(),{t:x.getTime()})}
else if(a=="addap"){const x=val("ax");if(!x)return;set("appt|"+uid(),{w:val("aw"),d:val("ad"),t:val("at"),x:x,y:val("ay")})}
else if(a=="td")set(k,Object.assign({},S[k],{done:true,dw:cw,dt:Date.now()}));
else if(a=="tdb")set(k,Object.assign({},S[k],{done:false,dw:""}));
else if(a=="addt"){const x=val("tx");if(!x)return;set("todo|"+uid(),{x:x,rep:document.getElementById("trep").checked,done:false,c:Date.now()})}
else if(a=="addb"){const n=val("bn"),d=val("bd");if(!n||!d)return;set("bill|"+uid(),{n:n,amt:val("ba"),d:d,rep:document.getElementById("brep").checked,paid:false})}
else if(a=="paid"){const x=S[k];set(k,Object.assign({},x,{paid:true,pd:td}));if(x.rep){const m=fromIso(x.d),t=new Date(m.getFullYear(),m.getMonth()+1,1);t.setDate(Math.min(m.getDate(),new Date(t.getFullYear(),t.getMonth()+1,0).getDate()));set("bill|"+uid(),{n:x.n,amt:x.amt,d:iso(t),rep:true,paid:false})}}
else if(a=="shd")set(k,Object.assign({},S[k],{done:true,dt:Date.now()}));
else if(a=="shb")set(k,Object.assign({},S[k],{done:false,dt:0}));
else if(a=="addsh"){const x=val("shx");if(!x)return;lastStore=val("shs");set("shop|"+uid(),{x:x,s:lastStore,c:Date.now(),done:false})}
else if(a=="addst"){const n=b.dataset.v||val("stn");if(!n)return;if(!list("store|").some(z=>z.n.toLowerCase()==n.toLowerCase()))set("store|"+uid(),{n:n,c:Date.now()})}
else if(a=="addid"){const x=val("idx");if(!x)return;set("idea|"+uid(),{x:x,n:val("idn"),c:Date.now()})}
else if(a=="pick"){const l=list("idea|");if(l.length)picked=l[Math.floor(Math.random()*l.length)].k}
else if(a=="addc"){const w=val("cw");if(!w)return;set("chat|"+uid(),{d:td,t:Date.now(),w:w,x:val("cx")})}
render()});
document.addEventListener("input",e=>{const t=e.target,k=t.dataset&&t.dataset.k;
if(t.id=="cq"){chatQ=t.value;chatN=40;const c=document.getElementById("clog");if(c)c.innerHTML=chatLog();return}
if(t.dataset&&t.dataset.sw){const o=swv(t.dataset.sw);set("sw|"+t.dataset.sw,{s:o.s||"plan",x:t.value});return}
if(k&&t.tagName=="INPUT")set(k,t.value)});
document.addEventListener("change",e=>{const k=e.target.dataset&&e.target.dataset.k;if(k&&k.indexOf("set|")==0)render()});
document.addEventListener("keydown",e=>{if(e.key!="Enter")return;const m={tx:"addt",cw:"addc",cx:"addc",ax:"addap",bn:"addb",ba:"addb",cin:"code",shx:"addsh",stn:"addst",idx:"addid",idn:"addid"}[e.target.id];if(m){const b=document.querySelector('[data-a="'+m+'"]');if(b)b.click()}});
document.addEventListener("visibilitychange",()=>{if(!document.hidden){pull();flush()}});
setInterval(()=>{pull();flush()},15000);
setInterval(()=>{const a=document.activeElement;if(tab=="today"&&(!a||!/INPUT|SELECT/.test(a.tagName)))render()},30000);
render();pull();flush();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
